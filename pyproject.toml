[project]
name = "autonomous-time-series-research-agent"
version = "0.1.0"
description = "An autonomous, evidence-governed time-series research runtime."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "prometheus-client>=0.26.0",
    "tenacity>=9",
]

[project.scripts]
research-agent = "research_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright",
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# Authored study programs retain the exact bytes hashed by their live research receipts.
extend-exclude = ["archive", "data", "docs", "learning", "studies"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D203",
    "D213",
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["INP001", "S101"]

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["../../engine/src"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
